---
deployment:
  tasks:
    - export DEPLOYPATH=/home/sdnc1967/public_html
    - export REPOPATH=/home/sdnc1967/repositories/deploy_demakijo
    - echo "Deploy from $REPOPATH to $DEPLOYPATH"
    - /bin/rsync -av --delete --exclude='.git' --exclude='.env' --exclude='.env.local' --exclude='node_modules' --exclude='vendor' $REPOPATH/ $DEPLOYPATH/
    - /bin/mkdir -p $DEPLOYPATH/storage/cache
    - /bin/mkdir -p $DEPLOYPATH/storage/framework/views
    - /bin/mkdir -p $DEPLOYPATH/storage/framework/cache
    - /bin/mkdir -p $DEPLOYPATH/storage/logs
    - /bin/find $DEPLOYPATH/storage/cache -name "*.bladec" -delete
    - /bin/find $DEPLOYPATH/storage/cache -name "*.php" -not -name ".gitkeep" -delete
    - /bin/find $DEPLOYPATH/storage/framework/views -name "*.php" -not -name ".gitkeep" -delete
    - /bin/chmod -R 755 $DEPLOYPATH/storage
    - /bin/mkdir -p $DEPLOYPATH/public/storage/uploads
    - /bin/chmod -R 755 $DEPLOYPATH/public/storage
    - php $DEPLOYPATH/migrate_add_role_to_users.php
    - php $DEPLOYPATH/migrate_add_kategori_to_prestasis.php
    - php $DEPLOYPATH/migrate_add_profile_fields_to_settings.php
    - php $DEPLOYPATH/migrate_add_gdrive_to_galeris.php
    - echo "Deploy selesai!"
